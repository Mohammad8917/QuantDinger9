name: Scheduled Source Sync

on:
  # Run once when this workflow is changed, so a newly installed or reactivated
  # schedule is exercised immediately instead of waiting for the next cron slot.
  push:
    paths:
      - '.github/workflows/auto-sync-sources.yml'
      - 'scripts/check_docs.py'
      - 'scripts/check_mojibake.py'
      - '.github/validation/check_docs.py'
      - '.github/validation/check_mojibake.py'
  schedule:
    # Azerbaijan time (UTC+4): 08:17, 12:17, 18:17 and 00:17.
    - cron: "17 4 * * *"
    - cron: "17 8 * * *"
    - cron: "17 14 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-source-sync-main
  cancel-in-progress: false

jobs:
  sync-and-validate:
    name: Mirror upstream trees, validate, and report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quantdinger_test
          POSTGRES_PASSWORD: quantdinger_test
          POSTGRES_DB: quantdinger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantdinger_test -d quantdinger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://quantdinger_test:quantdinger_test@127.0.0.1:5432/quantdinger_test
      DB_TYPE: postgresql
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_ENABLED: "false"
      SKIP_STARTUP_HOOKS: "1"
      SECRET_KEY: ci-secret-key-with-at-least-thirty-two-bytes
      ADMIN_USER: testadmin
      ADMIN_PASSWORD: testpass123
    steps:
      - name: Checkout destination
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Backend upstream
        uses: actions/checkout@v7
        with:
          repository: OpenByteInc/QuantDinger
          ref: main
          path: _sync/backend
          fetch-depth: 1

      - name: Checkout Frontend upstream
        uses: actions/checkout@v7
        with:
          repository: OpenByteInc/QuantDinger-Vue
          ref: main
          path: _sync/vue
          fetch-depth: 1

      - name: Record upstream revisions
        id: revisions
        shell: bash
        run: |
          echo "backend=$(git -C _sync/backend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(git -C _sync/vue rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Backend upstream: $(git -C _sync/backend rev-parse HEAD)"
          echo "Frontend upstream: $(git -C _sync/vue rev-parse HEAD)"

      - name: Mirror Backend tree while preserving this updater and Frontend slot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/_sync/' \
            --exclude='/QuantDinger-Vue/' \
            --exclude='/scripts/check_mojibake.py' \
            --exclude='/.github/workflows/auto-sync-sources.yml' \
            --exclude='/.github/validation/' \
            --filter='P /.github/validation/' \
            "_sync/backend/" "$GITHUB_WORKSPACE/"

      - name: Mirror Frontend into its isolated source directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p QuantDinger-Vue
          rsync -a --delete --exclude='/.git/' "_sync/vue/" "QuantDinger-Vue/"

      - name: Remove temporary checkouts and detect actual changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _sync
          git add -A --force
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Both source trees already match the destination."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend_api_python/requirements-dev.txt
            backend_api_python/requirements.lock

      - name: Install backend validation dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: backend_api_python
        run: python -m pip install --disable-pip-version-check -r requirements.lock -r requirements-dev.txt "ruff>=0.16.0,<0.17" "packaging>=24,<27"

      - name: Validate documentation, version, encoding, syntax and lint
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .github/validation/check_docs.py
          python scripts/check_version.py
          python .github/validation/check_mojibake.py
          python -m py_compile backend_api_python/run.py
          python -m compileall -q backend_api_python/app backend_api_python/scripts backend_api_python/tests
          ruff check backend_api_python/app backend_api_python/scripts backend_api_python/tests

      - name: Validate Docker Compose configurations
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.ghcr.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.observability.yml config -q

      - name: Run database migrations for tests
        if: steps.changes.outputs.changed == 'true'
        working-directory: backend_api_python
        env:
          QD_PROCESS_ROLE: migration
        run: python -m app.commands.migrate

      - name: Run backend unit and release-gate tests
        if: steps.changes.outputs.changed == 'true'
        working-directory: backend_api_python
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests -m "not integration and not stress" -q
          python -m pytest tests/release_gate -q
          QD_TEST_POSTGRES_DSN="$DATABASE_URL" python -m pytest \
            tests/integration/test_execution_projection_atomic.py \
            tests/integration/test_grid_fill_accounting.py -q

      - name: Set up pnpm
        if: steps.changes.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: QuantDinger-Vue/pnpm-lock.yaml

      - name: Test and build Frontend from the mirrored source
        if: steps.changes.outputs.changed == 'true'
        working-directory: QuantDinger-Vue
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run test:unit
          pnpm run build

      - name: Commit and push mirrored upstream trees
        if: always() && steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BACKEND_SHA: ${{ steps.revisions.outputs.backend }}
          FRONTEND_SHA: ${{ steps.revisions.outputs.frontend }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sync): mirror upstream sources" \
            -m "Backend source: OpenByteInc/QuantDinger@${BACKEND_SHA}" \
            -m "Frontend source: OpenByteInc/QuantDinger-Vue@${FRONTEND_SHA}"
          git push origin HEAD:main

      - name: Report no-op run
        if: steps.changes.outputs.changed == 'false'
        run: echo "No upstream content changes detected; destination was not modified."
