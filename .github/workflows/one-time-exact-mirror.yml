name: One-time exact upstream mirror
# Refresh trigger: 2026-10-18, mirror current upstream HEADs.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-exact-mirror.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quantdinger-exact-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Fetch current upstream snapshots
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/OpenByteInc/QuantDinger.git /tmp/qd-backend
          git clone --depth 1 https://github.com/OpenByteInc/QuantDinger-Vue.git /tmp/qd-frontend
          echo "Backend SHA: $(git -C /tmp/qd-backend rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend SHA: $(git -C /tmp/qd-frontend rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Mirror source trees
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='QuantDinger-Vue' /tmp/qd-backend/ "$GITHUB_WORKSPACE/"
          mkdir -p "$GITHUB_WORKSPACE/QuantDinger-Vue"
          rsync -a --delete --exclude='.git' /tmp/qd-frontend/ "$GITHUB_WORKSPACE/QuantDinger-Vue/"
          rsync -ainc --delete --out-format='%i %n%L' --exclude='.git' --exclude='.github' --exclude='QuantDinger-Vue' /tmp/qd-backend/ "$GITHUB_WORKSPACE/" > /tmp/backend-diff.txt
          rsync -ainc --delete --out-format='%i %n%L' --exclude='.git' /tmp/qd-frontend/ "$GITHUB_WORKSPACE/QuantDinger-Vue/" > /tmp/frontend-diff.txt
          if [[ -s /tmp/backend-diff.txt || -s /tmp/frontend-diff.txt ]]; then
            echo "::error::Source/destination checksum or path-set mismatch."
            cat /tmp/backend-diff.txt /tmp/frontend-diff.txt
            exit 1
          fi
          echo "PASS: backend and frontend path sets and file checksums match current upstream snapshots." >> "$GITHUB_STEP_SUMMARY"
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(sync): mirror latest QuantDinger backend and frontend"
            git push origin HEAD:main
          else
            echo "Already matches current upstream files." >> "$GITHUB_STEP_SUMMARY"
          fi
