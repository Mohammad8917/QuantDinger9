<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="/slogo.png">
    <title>QuantDinger</title>
    <script>
      (function () {
        var root = document.documentElement
        var theme = 'realdark'
        var accent = '#ff5a1f'
        try {
          var storedTheme = window.localStorage.getItem('nav_theme')
          var storedAccent = window.localStorage.getItem('qd-ui-primary-color') || window.localStorage.getItem('color')
          theme = storedTheme ? JSON.parse(storedTheme) : theme
          accent = storedAccent ? JSON.parse(storedAccent) : accent
        } catch (error) {}
        root.classList.add(theme === 'light' ? 'qd-loading-light' : 'qd-loading-dark')
        if (/^#[0-9a-f]{6}$/i.test(accent)) {
          root.style.setProperty('--qd-loading-accent', accent)
        }
      })()
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .first-loading-wrp {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #111827;
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(20, 184, 166, 0.08)),
          #f8fbff;
      }

      .first-loading-card {
        width: 420px;
        max-width: calc(100% - 32px);
        display: grid;
        justify-items: center;
        gap: 18px;
        padding: 36px 34px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(16px);
      }

      .brand-mark {
        position: relative;
        display: block;
        width: 300px;
        max-width: 100%;
        line-height: 0;
        animation: qdFloat 2.8s ease-in-out infinite;
      }

      .brand-mark__image {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 18px 32px rgba(37, 99, 235, 0.18));
      }

      .brand-mark__dark-wordmark {
        position: absolute;
        inset: 0;
        display: none;
        clip-path: inset(0 0 0 19%);
        filter: brightness(0) invert(1);
      }

      .brand-subtitle {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }

      .loading-line {
        width: 220px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.12);
      }

      .loading-line::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1d4ed8, #14b8a6);
        animation: qdLoad 1.15s ease-in-out infinite;
      }

      .loading-copy {
        margin: 0;
        color: #64748b;
        font-size: 13px;
      }

      @keyframes qdLoad {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @keyframes qdFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      .qd-loading-dark .first-loading-wrp {
        color: #f5f5f5;
        background: #0b0b0b;
      }

      .qd-loading-dark .first-loading-card {
        border-color: #2a2a2a;
        background: #141414;
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
      }

      .qd-loading-dark .brand-mark__base {
        filter: drop-shadow(0 0 0.8px rgba(255, 255, 255, 0.92));
      }

      .qd-loading-dark .brand-mark__dark-wordmark {
        display: block;
      }

      .qd-loading-dark .brand-subtitle,
      .qd-loading-dark .loading-copy {
        color: #8c8c8c;
      }

      .qd-loading-dark .loading-line {
        background: rgba(255, 255, 255, 0.08);
      }

      .qd-loading-dark .loading-line::before {
        background: var(--qd-loading-accent, #ff5a1f);
      }

      @media (prefers-color-scheme: dark) {
        html:not(.qd-loading-light) .first-loading-wrp {
          color: #f8fafc;
          background: #0b0b0b;
        }

        html:not(.qd-loading-light) .first-loading-card {
          border-color: #2a2a2a;
          background: #141414;
          box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
        }

        html:not(.qd-loading-light) .brand-mark__base {
          filter: drop-shadow(0 0 0.8px rgba(255, 255, 255, 0.92));
        }

        html:not(.qd-loading-light) .brand-mark__dark-wordmark {
          display: block;
        }

        html:not(.qd-loading-light) .brand-subtitle,
        html:not(.qd-loading-light) .loading-copy {
          color: #8c8c8c;
        }

        html:not(.qd-loading-light) .loading-line {
          background: rgba(255, 255, 255, 0.08);
        }

        html:not(.qd-loading-light) .loading-line::before {
          background: var(--qd-loading-accent, #ff5a1f);
        }
      }

      @media (max-width: 640px) {
        .first-loading-wrp {
          padding: 16px;
        }

        .first-loading-card {
          width: 100%;
          max-width: calc(100% - 16px);
          padding: 30px 22px;
        }

        .brand-mark {
          width: 260px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but QuantDinger doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div class="first-loading-wrp">
        <div class="first-loading-card">
          <span class="brand-mark" role="img" aria-label="QuantDinger">
            <img class="brand-mark__image brand-mark__base" src="/logo.png" alt="">
            <img class="brand-mark__image brand-mark__dark-wordmark" src="/logo.png" alt="" aria-hidden="true">
          </span>
          <p class="brand-subtitle">AI quantitative trading infrastructure</p>
          <div class="loading-line" aria-hidden="true"></div>
          <p class="loading-copy">Loading workspace...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
